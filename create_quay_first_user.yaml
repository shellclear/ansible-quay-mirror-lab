---
# ANSIBLE_COLLECTIONS_PATH=$PWD ansible-playbook -K -e @inventory_quay01.yaml create_quay_first_user.yaml
# ANSIBLE_COLLECTIONS_PATH=$PWD ansible-playbook -K -e @inventory_quay02.yaml create_quay_first_user.yaml
- name: Bootstrapping a fresh Quay Container Registry installation
  hosts: all
  connection: "local"

  tasks:
    - name: Ensure the initial user exists
      infra.quay_configuration.quay_first_user:
        username: quayadmin
        email: quayadmin@example.com
        password: password
        create_token: true
        quay_host: https://{{ quay_fqdn }}:{{ https_port }}
        validate_certs: false
      register: result

    # The token is valid for 2 hours and 30 minutes
    - name: Display the generated OAuth access token
      debug:
        msg: "Access token: {{ result['access_token'] }}"

    - name: Ensure the user exists
      infra.quay_configuration.quay_user:
        username: user1
        email: user1@example.com
        password: password
        state: present
        quay_token: "{{ result['access_token'] }}"
        quay_host: https://{{ quay_fqdn }}:{{ https_port }}
        validate_certs: false
...
